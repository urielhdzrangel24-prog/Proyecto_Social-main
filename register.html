<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta — SynergAI</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-shell">
      <a class="back-link" href="/">← Volver al inicio</a>
      <section class="login-card" aria-labelledby="register-title">
        <div class="login-brand"><img src="logoSAI.png" alt="" /><span>SynergAI</span></div>
        <span class="kicker">COMIENZA TU RECORRIDO</span>
        <h1 id="register-title">Crea tu<br /><em>cuenta.</em></h1>
        <p class="intro">Elige tu perfil y empieza a construir una mejor forma de aprender.</p>
        <form id="register-form">
          <label for="name">Nombre completo</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Tu nombre" minlength="2" maxlength="80" required />
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@correo.com" required />
          <label for="role">Quiero registrarme como</label>
          <select id="role" name="role"><option value="student">Estudiante</option><option value="teacher">Maestro</option><option value="parent">Padre o tutor</option></select>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8" required />
          <small class="password-hint">Usa una mayúscula, una minúscula y un número.</small>
          <p id="register-error" class="form-message" role="alert"></p>
          <button type="submit">Crear cuenta <span>→</span></button>
        </form>
        <p class="switch-auth">¿Ya tienes cuenta? <a href="/login">Entra aquí</a></p>
      </section>
      <aside class="login-aside" aria-hidden="true"><div class="aside-orb"></div><span class="kicker">APRENDER, CONECTAR, AVANZAR</span><h2>Tu espacio para<br /><em>hacerlo posible.</em></h2></aside>
    </main>
    <div id="auth-feedback" class="auth-feedback" role="alert"><span id="auth-feedback-message"></span><button id="auth-feedback-close" aria-label="Cerrar mensaje">Cerrar</button></div><script src="register.js"></script>
  </body>
</html>
