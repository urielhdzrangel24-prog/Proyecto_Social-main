<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — SynergAI</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-shell">
      <a class="back-link" href="/">← Volver al inicio</a>
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-brand"><img src="logoSAI.png" alt="" /><span>SynergAI</span></div>
        <span class="kicker">TU ESPACIO DE APRENDIZAJE</span>
        <h1 id="login-title">Qué bueno verte<br /><em>de nuevo.</em></h1>
        <p class="intro">Entra para continuar con tus clases, actividades y progreso.</p>
        <form id="login-form">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@correo.com" required />
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          <p id="login-error" class="form-message" role="alert"></p>
          <button type="submit">Entrar <span>→</span></button>
        </form>
        <div class="demo-access"><strong>Acceso de prueba</strong><span>maestro@demo.com · maestro123</span></div>
      </section>
      <aside class="login-aside" aria-label="Beneficios de SynergAI">
        <div class="aside-orb"></div>
        <span class="kicker">APRENDER, CONECTAR, AVANZAR</span>
        <h2>Todo tu camino<br /><em>en un solo lugar.</em></h2>
        <div class="aside-note"><span>✦</span><div><strong>Tu progreso importa</strong><small>Avanza a tu propio ritmo.</small></div></div>
      </aside>
    </main>
    <script src="login.js"></script>
  </body>
</html>
